spring.application.name=backend

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=AquaSafariDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

server.port=8080

# ---- JWT ----
# Secret must be at least 256 bits (32+ characters) for HS256. Generate your
aquasafari.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
aquasafari.jwt.expiration-ms=86400000

# =====================================================================
# Feedback Management module
# =====================================================================
# Booking statuses that count as "the customer actually travelled".
# Add COMPLETED here as soon as the Booking module starts writing it.
aquasafari.feedback.completed-statuses=CONFIRMED,COMPLETED

# Require a verified (PAID) payment before a review is accepted.
# Set to false while demoing if the Payment module is not seeded yet.
aquasafari.feedback.require-paid-booking=true

# Words rejected by the content check in step 4 of the use case.
aquasafari.feedback.blocked-words=damn,idiot,stupid,scam,fraud,rubbish,hate,useless,pathetic
