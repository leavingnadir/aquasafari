spring.application.name=backend

spring.datasource.url=jdbc:sqlserver://localhost\\SQLEXPRESS;databaseName=AquaSafariDB;encrypt=true;trustServerCertificate=true;integratedSecurity=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect


server.port=8080

# ---- JWT ----
# Secret must be at least 256 bits (32+ characters) for HS256. Generate your
# own random string for the real deployment - this is a placeholder.
aquasafari.jwt.secret=${JWT_SECRET:aquasafari-dev-secret-change-this-before-deploying-32chars-min}
aquasafari.jwt.expiration-ms=86400000