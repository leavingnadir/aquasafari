# AquaSafari — application.properties template
#
# Copy this into backend/src/main/resources/application.properties
# (that real file should be git-ignored — never commit actual passwords).
#
# The whole team connects to ONE shared Azure SQL Database — no local
# SQL Server install is needed on any laptop.

spring.datasource.url=jdbc:sqlserver://<your-server-name>.database.windows.net:1433;database=AquaSafariDB;encrypt=true;trustServerCertificate=false
spring.datasource.username=<shared_admin_username>
spring.datasource.password=<shared_admin_password>
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# Server port (optional)
# server.port=8080
